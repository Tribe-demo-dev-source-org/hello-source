name: Mirror Pull

# DESTINATION repo only ("MetLife"). Doc 3.1.
# This file arrives in the destination with the rest of the tree, because the
# destination's main is a fast-forward of the source's main. In the source repo,
# the job-level if makes it a no-op.
#
# Triggers:
#   - repository_dispatch from the doorbell. The payload is ignored.
#   - schedule and workflow_dispatch, for resilience. The chain keeps working
#     without the doorbell.
#
# Steps:
#   1. Fetch the source main and tags with the read-only Reader App.
#   2. Ancestry check (doc 4.1).
#   3. Push to incoming/main as the Ingest App.
#   4. Dispatch the scan with the full SHA.
#   5. Publish vX.Y tags that are reachable from the scanned main, then dispatch the
#      release-branch cut for each.

on:
  repository_dispatch:
    types: [mirror-pull]
  workflow_dispatch:
    inputs:
      rescan:
        description: Dispatch the scan even if incoming/main did not move
        type: boolean
        default: false
  # Every 30 minutes, weekdays, roughly 08:00-19:00 US Eastern.
  # Comment this out to keep the Actions tab quiet while recording.
  schedule:
    - cron: "*/30 12-23 * * 1-5"

concurrency:
  group: mirror-pull
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # the dispatches below use GITHUB_TOKEN

jobs:
  pull:
    name: Pull from source
    if: github.repository == format('{0}/{1}', vars.DEST_OWNER, vars.DEST_REPO)
    runs-on: ubuntu-latest
    steps:
      - name: Mint an Ingest App token (this repo, including workflow files)
        id: ingest
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.INGEST_CLIENT_ID }}
          private-key: ${{ secrets.INGEST_PRIVATE_KEY }}
          owner: ${{ vars.DEST_OWNER }}
          repositories: ${{ vars.DEST_REPO }}
          permission-contents: write
          permission-workflows: write

      - name: Mint a Reader App token (source repo, read-only)
        id: reader
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.READER_CLIENT_ID }}
          private-key: ${{ secrets.READER_PRIVATE_KEY }}
          owner: ${{ vars.SOURCE_OWNER }}
          repositories: ${{ vars.SOURCE_REPO }}
          permission-contents: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the ancestry checks need real history
          token: ${{ steps.ingest.outputs.token }}

      # The checkout persisted the Ingest token for github.com. Clear that header for
      # this one fetch so it authenticates only with the Reader token.
      - name: Fetch source main and tags over HTTPS
        env:
          READER_TOKEN: ${{ steps.reader.outputs.token }}
          SRC: ${{ vars.SOURCE_OWNER }}/${{ vars.SOURCE_REPO }}
        run: |
          set -euo pipefail
          git -c 'http.https://github.com/.extraheader=' fetch --no-tags \
            "https://x-access-token:${READER_TOKEN}@github.com/${SRC}.git" \
            '+refs/heads/main:refs/remotes/source/main' \
            '+refs/tags/v*:refs/source-tags/v*'

      - name: Ancestry check, then push to incoming/main
        id: pull
        run: |
          set -euo pipefail
          src="$(git rev-parse refs/remotes/source/main)"
          dest="$(git rev-parse origin/main)"
          echo "source main:      $src"
          echo "destination main: $dest"
          if ! git merge-base --is-ancestor "$dest" "$src"; then
            echo "::error::Destination main ($dest) is not an ancestor of source main ($src). The histories have diverged or the destination is ahead. Refusing; nothing was pushed."
            exit 1
          fi
          incoming="$(git rev-parse -q --verify refs/remotes/origin/incoming/main || true)"
          moved=false
          if [ "$incoming" != "$src" ]; then
            if [ -n "$incoming" ] && ! git merge-base --is-ancestor "$incoming" "$src"; then
              echo "::error::incoming/main ($incoming) is not an ancestor of source main. Refusing."
              exit 1
            fi
            git push origin "$src:refs/heads/incoming/main"
            moved=true
          fi
          {
            echo "src=$src"
            echo "dest=$dest"
            echo "moved=$moved"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Mirror pull"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\` (payload ignored)"
            echo "- Source main: \`$src\`"
            echo "- Destination main: \`$dest\`"
            echo "- incoming/main moved: $moved"
          } >> "$GITHUB_STEP_SUMMARY"

      # Dispatched, not push-triggered: the scan runs from the trusted main, and the
      # new commit arrives only as an input (doc 3, "Why dispatch").
      - name: Dispatch the scan
        if: steps.pull.outputs.src != steps.pull.outputs.dest && (steps.pull.outputs.moved == 'true' || inputs.rescan)
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pull.outputs.src }}
        run: |
          gh workflow run scan-and-promote.yml --repo "$GITHUB_REPOSITORY" --ref main -f sha="$SHA"
          echo "- Scan dispatched for \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release tags that are on scanned main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in $(git for-each-ref --format='%(refname)' 'refs/source-tags/v*'); do
            tag="${ref#refs/source-tags/}"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+$ ]]; then echo "skip $tag (not vX.Y)"; continue; fi
            commit="$(git rev-parse "${ref}^{commit}")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already published"
              continue
            fi
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "$tag ($commit) is not on scanned main yet. Pending until the next fast-forward."
              continue
            fi
            git push origin "${ref}:refs/tags/$tag"
            gh workflow run release-branch.yml --repo "$GITHUB_REPOSITORY" --ref main -f tag="$tag"
            echo "- Published \`$tag\` and dispatched the release-branch cut" >> "$GITHUB_STEP_SUMMARY"
          done
