name: Deploy
run-name: Deploy ${{ inputs.env }} from ${{ github.ref_name }}

# DESTINATION repo only ("MetLife"). Doc 3.3 and 3.5.
# Saved-plan Terraform. The plan job writes `terraform show` to the run summary and
# uploads tfplan. The apply job applies exactly that file, with no re-plan.
# Terraform refuses a stale plan.
#
#   env=qa   : ref must be main.       plan and apply both run in the `qa` Environment (no reviewers).
#   env=prod : ref must be release/*.  plan runs in `prod-plan` (no reviewers, read-only
#              identity). apply runs in `prod` (required reviewer, branch policy release/*).
#
# DEPLOY_MODE repo variable:
#   azure (default): Azure Storage static website, azurerm backend, OIDC (infra/azure).
#   local (NO-CLOUD): renders the page with the local provider and uploads it as an
#                     artifact (infra/local). Use it if Azure isn't approved.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        type: choice
        options: [qa, prod]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.env }}
  cancel-in-progress: false # never cancel an apply

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TARGET_ENV: ${{ inputs.env }}
  MODE: ${{ vars.DEPLOY_MODE == 'local' && 'local' || 'azure' }}
  # Terraform azurerm provider: OIDC from the job's Environment (doc 2.5, 2.6).
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: Plan (${{ inputs.env == 'prod' && 'prod-plan' || 'qa' }})
    if: >-
      github.repository == format('{0}/{1}', vars.DEST_OWNER, vars.DEST_REPO) &&
      ((inputs.env == 'qa' && github.ref == 'refs/heads/main') ||
       (inputs.env == 'prod' && startsWith(github.ref, 'refs/heads/release/')))
    runs-on: ubuntu-latest
    environment: ${{ inputs.env == 'prod' && 'prod-plan' || 'qa' }}
    permissions:
      contents: read
      id-token: write # OIDC to Azure; the federated credential's subject is this Environment
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Azure login (OIDC, no stored secret)
        if: env.MODE == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = prod ]; then
            # release/v1.0-abc1234 -> v1.0
            v="${GITHUB_REF_NAME#release/}"; v="${v%-*}"
          else
            v="main@${GITHUB_SHA:0:7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: terraform init and plan -out=tfplan
        working-directory: infra/${{ env.MODE }}
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          args=(-var "environment=${TARGET_ENV}" -var "commit=${GITHUB_SHA}" -var "app_version=${APP_VERSION}")
          if [ "$MODE" = azure ]; then
            terraform init -backend-config="backend/${TARGET_ENV}.hcl"
            args+=(-var-file="env/${TARGET_ENV}.tfvars")
            # The prod-plan identity can only read state, so it cannot take the state
            # lease. Plan without a lock. The apply job locks.
            if [ "$TARGET_ENV" = prod ]; then args+=(-lock=false); fi
          else
            terraform init
          fi
          terraform plan "${args[@]}" -out=tfplan
          {
            echo "### Terraform plan: ${TARGET_ENV} (${MODE}), ${APP_VERSION}"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Plans can contain sensitive values, so keep the retention short. Seven days
      # is the approval window: approve the prod apply within 7 days, or re-run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.env }}
          path: infra/${{ env.MODE }}/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Apply saved plan (${{ inputs.env }})
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Azure login (OIDC, no stored secret)
        if: env.MODE == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.env }}
          path: infra/${{ env.MODE }}

      - name: terraform apply tfplan (the reviewed plan, no re-plan)
        working-directory: infra/${{ env.MODE }}
        run: |
          set -euo pipefail
          if [ "$MODE" = azure ]; then
            terraform init -backend-config="backend/${TARGET_ENV}.hcl"
          else
            terraform init
          fi
          terraform apply tfplan
          url="$(terraform output -raw url)"
          echo "### Deployed ${TARGET_ENV}: ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rendered site (NO-CLOUD mode)
        if: env.MODE == 'local'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ inputs.env }}
          path: infra/local/site/index.html
          retention-days: 7
