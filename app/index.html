<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello DEMO-FINDING from the code-promotion demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f9; color: #1d2330; }
    main { background: #fff; padding: 2.5rem 3rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; }
    h1 { margin: 0 0 1rem; font-size: 1.8rem; }
    dl { display: grid; grid-template-columns: auto auto; gap: .4rem 1rem; margin: 0; text-align: left; }
    dt { color: #5b6473; }
    dd { margin: 0; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world</h1>
    <dl>
      <dt>Environment</dt><dd>__ENVIRONMENT__</dd>
      <dt>Version</dt><dd>__VERSION__</dd>
      <dt>Commit</dt><dd>__COMMIT__</dd>
    </dl>
  </main>
</body>
</html>
